<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عروض السيارات الإمارات</title>

<style>
body{
  margin:0;
  padding:35px 20px;
  background:#0b1220;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.card{
  max-width:430px;
  margin:auto;
  background:#182237;
  border-radius:24px;
  padding:32px 22px;
  text-align:center;
}
h1{font-size:30px;margin-bottom:12px}
.offer{font-size:20px;line-height:1.8}
.highlight{font-size:26px;font-weight:800;margin:20px 0}
button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:18px;
  font-size:19px;
  font-weight:700;
  background:#59c789;
  color:white;
}
.note{
  margin-top:16px;
  opacity:.75;
  font-size:14px;
  line-height:1.6;
}
#result{margin-top:20px;line-height:1.8}
</style>
</head>

<body>
<div class="card">

<h1>🚗 عروض السيارات في الإمارات</h1>

<div class="offer">
احصل على أقل أسعار السيارات
بأقساط شهرية مريحة
</div>

<div class="highlight">
بدون دفعة أولى
</div>

<p>اكتشف العروض المتوفرة بالقرب منك</p>

<button onclick="findOffers()">
📍 اعرض العروض القريبة مني
</button>

<div class="note">
سيطلب Safari إذنك باستخدام موقعك لعرض النتائج حسب منطقتك.
</div>

<div id="result"></div>

</div>

<script>
function findOffers(){

 const box=document.getElementById("result");

 if(!navigator.geolocation){
   box.innerHTML="خدمة الموقع غير مدعومة.";
   return;
 }

 box.innerHTML="جاري تحديد منطقتك...";

 navigator.geolocation.getCurrentPosition(
   function(position){

     const lat=position.coords.latitude;
     const lon=position.coords.longitude;

     box.innerHTML=
       "✅ تم تحديد منطقتك بنجاح<br>" +
       "جاري البحث عن العروض القريبة...";
   },

   function(){
     box.innerHTML=
       "تعذر تحديد منطقتك. يرجى السماح باستخدام الموقع لعرض العروض القريبة.";
   },

   {
     enableHighAccuracy:true,
     timeout:15000,
     maximumAge:0
   }
 );
}
</script>
</body>
</html>
